<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Projects | The Code Society</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #000; }
    body { min-height: 100vh; display: flex; flex-direction: column; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    header { min-height: 88px; padding: 0 clamp(24px, 6vw, 88px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.12); }
    a { color: inherit; text-decoration: none; }
    .brand { font-size: 17px; font-weight: 700; letter-spacing: -.04em; }
    .back { color: rgba(255,255,255,.7); font-size: 13px; transition: color .2s; }
    .back:hover { color: #ed2929; }
    main { flex: 1; display: grid; place-items: center; padding: 64px 24px; text-align: center; }
    .content { max-width: 760px; }
    .kicker { margin: 0 0 26px; color: #ed2929; font: 11px/1.5 monospace; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(52px, 10vw, 112px); line-height: .92; letter-spacing: -.08em; font-weight: 800; }
    h1 span { color: #ed2929; }
    .description { max-width: 480px; margin: 28px auto 0; color: rgba(255,255,255,.58); font-size: 16px; line-height: 1.8; }
    .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 42px; padding: 13px 17px; border: 1px solid rgba(237,41,41,.45); color: #fff; font: 11px/1.4 monospace; letter-spacing: .12em; text-transform: uppercase; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #ed2929; box-shadow: 0 0 12px #ed2929; }
    footer { padding: 22px 24px; border-top: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.38); text-align: center; font: 10px/1.5 monospace; letter-spacing: .05em; }
    @media (max-width: 520px) { header { min-height: 76px; } .description { font-size: 14px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">The Code Society</a>
    <a class="back" href="index.html">← Back to home</a>
  </header>
  <main>
    <div class="content">
      <p class="kicker">The Code Society / Projects</p>
      <h1>Something is <span>building.</span></h1>
      <p class="description">Our project directory is being prepared. Soon, you’ll be able to explore projects, find something that interests you, and start contributing.</p>
      <div class="status">Projects coming soon</div>
    </div>
  </main>
  <footer>© 2026 The Code Society. Built by the community.</footer>
</body>
</html>
